[package]
name = "joinedcontext-portal"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "joinedcontext Portal: one application that manages the platform (Rust API + reconciler + embedded React UI)"

[lib]
name = "joinedcontext_portal"
path = "src/lib.rs"

[[bin]]
name = "joinedcontext-portal"
path = "src/main.rs"

[dependencies]
# The manifest contract, by tag, never by path into another agent's clone (T-0249).
jc-core = { git = "https://github.com/marek-mraz/joinedcontext-platform.git", tag = "jc-core-v0.3.0" }
# Only to render jc-core's schemas into the OpenAPI document; the Portal's own types use utoipa.
schemars = "0.8"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie-private"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["set-header", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
utoipa = { version = "5", features = ["axum_extras"] }
rust-embed = "8"
mime_guess = "2"
openidconnect = "4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"
base64 = "0.23"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

# ponytail: line tables only, no full debuginfo — several agents compile on one machine
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 1
debug = false
