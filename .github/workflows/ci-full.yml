name: ci-full
# the slow lane: runs once an hour on main and on demand; never a PR gate.
# The MVP pushes to main many times an hour, and a full run per push queued behind the next
# one; ci.yml stays the per-push gate. tasks/ci files a task for a red hourly run like any other.
# To put the per-push trigger back: add `push: { branches: [main] }` under `on:`.
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-full-${{ github.ref }}", cancel-in-progress: false }
jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The kit bundle is embedded at build time (sdk/dist, ignored in git); the integration
      # tests under tests/ take the preview branch only when it is there, so the slow lane
      # builds it first and tests the Portal as it ships (AP-56, AP-63).
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cargo test --workspace --all-targets --all-features
        env: { JC_PREVIEW_OUT: "${{ runner.temp }}/preview" }
      # The template's preview document, as the test above wrote it, rendered in a sandboxed
      # frame with its own policy (SDK-16, T-0678).
      - run: cd sdk && pnpm exec playwright install --with-deps chromium && pnpm e2e
        env: { JC_PREVIEW_OUT: "${{ runner.temp }}/preview" }
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-audit,cargo-deny" }
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      - if: steps.has.outputs.ui == 'no'
        run: echo "no ui/package.json yet"
      # The reference apps run their flows against their own binary, so the toolchain has to
      # be here too (AP-34, AP-40).
      - if: steps.has.outputs.ui == 'yes'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.has.outputs.ui == 'yes'
        uses: Swatinem/rust-cache@v2
      - if: steps.has.outputs.ui == 'yes'
        name: the reference app flows
        run: |
          set -eu
          for app in apps/*/ui; do
            [ -f "$app/playwright.config.ts" ] || continue
            (cd "$app" && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e)
          done
