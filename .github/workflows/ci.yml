name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm lint && pnpm test -- --run && pnpm build
      - if: steps.has.outputs.ui == 'no'
        run: echo "no ui/package.json yet"
      # The reference apps of AP-34 carry their own bundle; the Rust half is covered by the
      # workspace lanes above, this is its screens.
      - if: steps.has.outputs.ui == 'yes'
        name: the reference apps build and their screens pass
        run: |
          set -eu
          for app in apps/*/ui; do
            [ -f "$app/package.json" ] || continue
            (cd "$app" && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build)
          done
