# The hsl-transport reference app (AP-34, AP-38). Hand written, so no generated-by annotation.
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: hsl-transport
  namespace: helsinki
  title:
    fi: "Bussit livenä"
    en: "Buses live"
  description:
    fi: "30 bussin sijainti kartalla, päivittyy jatkuvasti."
    en: "The position of 30 buses on a map, updated as they move."
spec:
  kind: fullstack
  source:
    path: ./apps/hsl-transport
  build:
    rust: "1.90"
    node: "22"
  # Public: the endpoint behind it is public and the app never sees a user (AP-28). Widening
  # the audience is what puts this publication in the yellow lane (AP-20).
  visibility: public
  # A reference app ships with the platform, so its publication is the commit that adds it and
  # its review is the pull request; there is no earlier state for it to sit in (AP-20).
  lifecycle: published
  # The Portal frames it in the apps catalogue, which is what `embeddable` is for (AP-12).
  embeddable: true
  dataNeeds:
    # One space, one type, read only. No write anywhere in this app.
    - contextSpaceRef:
        kind: ContextSpace
        name: transport
      types: [Vehicle]
      attrs: [location, bearing, speed, refLine]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld, geojson]
  limits:
    requestsPerMinute: 1200
    maxFileRows: 5000
