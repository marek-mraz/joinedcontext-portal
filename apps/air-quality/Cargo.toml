[package]
name = "air-quality"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "The air-quality reference app: stations, 24 hours of history and a steward note, all through one Endpoint"

[lib]
name = "air_quality"
path = "src/lib.rs"

[[bin]]
name = "air-quality"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `X-Userinfo` is base64 JSON, the way the edge's openid-connect plugin sends it (AP-28).
base64 = "0.23"
# The only outbound client the app has. Rustls, no native roots: the app talks to one host,
# its endpoint, and that host presents a publicly trusted certificate (AP-37).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
