[advisories]
# See .cargo/audit.toml for the reasoning: `rsa` arrives with `openidconnect`, no fix exists,
# and only RSA private-key operations are affected. The portal only verifies with public keys.
ignore = ["RUSTSEC-2023-0071"]
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "OpenSSL"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/marek-mraz/joinedcontext-platform"]
